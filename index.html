<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<title>メンバー名簿</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--ink:#1b1d22;--muted:#6b7280;--line:#e4e6eb;
  --accent:#5b3cf5;--accent-soft:#ece8ff;--chip:#f0f1f4;--sel:#fff7d6;
  --gold:#c99a06;--silver:#8a94a3;--bronze:#b86b2c;--new:#e11d74;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111318;--surface:#1a1d24;--ink:#e9eaee;--muted:#9aa1ad;--line:#2a2e38;
  --accent:#a18cff;--accent-soft:#2a2445;--chip:#232732;--sel:#3a3320;
  --gold:#e7bb2c;--silver:#b5bdc9;--bronze:#d98a4a;--new:#ff5fa2;
}}
:root[data-theme=dark]{
  --bg:#111318;--surface:#1a1d24;--ink:#e9eaee;--muted:#9aa1ad;--line:#2a2e38;
  --accent:#a18cff;--accent-soft:#2a2445;--chip:#232732;--sel:#3a3320;
  --gold:#e7bb2c;--silver:#b5bdc9;--bronze:#d98a4a;--new:#ff5fa2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 120px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:1.6rem;margin:0;letter-spacing:.02em}
.status{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.ok{background:#16a34a}.dot.err{background:#dc2626}.dot.load{background:#f59e0b}
button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:.75rem;color:var(--muted)}
.stat .v{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-size:.75rem;color:var(--muted);min-width:64px}
input[type=search],input[type=number]{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=search]{flex:1 1 260px}
input[type=number]{width:96px}
select{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 11px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.check{font-size:.82rem;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;white-space:nowrap;z-index:1}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--accent)}
th.s.on{color:var(--accent)}th.s.on::after{content:" ▼";font-size:.65rem}th.s.on.asc::after{content:" ▲"}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.picked{background:var(--sel)}
.ck{width:34px;text-align:center}
.rank{width:44px;text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rank.r1{color:var(--gold)}.rank.r2{color:var(--silver)}.rank.r3{color:var(--bronze)}
.name{font-weight:700}
.date{font-size:.72rem;color:var(--muted);font-weight:400}
.newb{font-size:.65rem;font-weight:700;color:var(--new);border:1px solid var(--new);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.power{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden;width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.wlink{}
.main{font-weight:600}
.cat{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;white-space:nowrap;cursor:pointer}
.subs{color:var(--muted);font-size:.84rem}
.other{color:var(--muted);font-size:.8rem;max-width:200px}
a.x{color:var(--accent);text-decoration:none;white-space:nowrap}a.x:hover{text-decoration:underline}
.fc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.84rem;white-space:nowrap}
.copy{padding:1px 7px;font-size:.7rem;margin-left:4px;border-radius:6px}
.none{color:var(--line)}
.empty,.msg{padding:40px;text-align:center;color:var(--muted)}
.selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;gap:12px;align-items:center;flex-wrap:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:.85rem;z-index:5}
.selbar.show{display:flex}
.selbar .info{display:flex;gap:12px;white-space:nowrap}
.selbar button{white-space:nowrap}
.selbar b{font-variant-numeric:tabular-nums}
.selbar button{background:transparent;color:inherit;border-color:rgba(127,127,127,.5)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
kbd{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.filters{display:grid;gap:12px}
.ftoggle{display:none}
.ftoggle .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:#fff;font-size:.7rem;line-height:18px;text-align:center}
.ftoggle .badge:empty{display:none}
.shown-m{display:none}
.mreset{display:none}
.ml{display:none}
.totop{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.1rem;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;z-index:4}
.totop.show{display:block}
body.has-sel .totop{bottom:130px}
@media (max-width:760px){html:not(.force-pc) .wrap{padding:14px 12px 150px}html:not(.force-pc) header{margin-bottom:10px;align-items:center}html:not(.force-pc) h1{font-size:1.25rem}html:not(.force-pc) header>.status{gap:6px}html:not(.force-pc) header>.status .check{font-size:.75rem}html:not(.force-pc) header>.status .check input{width:16px;height:16px}html:not(.force-pc) header button{padding:6px 10px;font-size:.78rem}html:not(.force-pc) .stats{display:flex;overflow-x:auto;gap:8px;margin:0 -12px 10px;padding:0 12px;scrollbar-width:none}html:not(.force-pc) .stats::-webkit-scrollbar{display:none}html:not(.force-pc) .stat{flex:0 0 auto;min-width:104px;padding:8px 12px;border-radius:10px}html:not(.force-pc) .stat .k{font-size:.68rem}html:not(.force-pc) .stat .v{font-size:1.1rem}html:not(.force-pc) .panel{position:sticky;top:0;z-index:3;margin:0 -12px 12px;border-radius:0;border-left:none;border-right:none;padding:10px 12px;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.06)}html:not(.force-pc) .panel>.row:first-child{flex-wrap:nowrap;gap:6px}html:not(.force-pc) input[type=search]{flex:1 1 0;width:0;min-width:0;font-size:16px;padding:9px 12px}html:not(.force-pc) select{font-size:14px;padding:8px 4px;flex:0 1 112px;min-width:0;width:112px}html:not(.force-pc) #clear{display:none}html:not(.force-pc) .ftoggle{display:inline-flex;align-items:center;white-space:nowrap;padding:8px 10px;flex:0 0 auto}html:not(.force-pc) .shown-m{display:block;font-size:.75rem;color:var(--muted);margin-top:-4px}html:not(.force-pc) .filters{display:none;max-height:62vh;overflow-y:auto;gap:12px}html:not(.force-pc) .panel.open .filters{display:grid}html:not(.force-pc) .filters .row{gap:8px}html:not(.force-pc) .mreset{display:flex}html:not(.force-pc) .mreset button{width:100%;padding:10px}html:not(.force-pc) .dl{display:none}html:not(.force-pc) .ml{display:inline}html:not(.force-pc) .lbl{min-width:0;width:100%;font-weight:600}html:not(.force-pc) #chips,html:not(.force-pc) #presets{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}html:not(.force-pc) #chips::-webkit-scrollbar,html:not(.force-pc) #presets::-webkit-scrollbar{display:none}html:not(.force-pc) .chip{flex:0 0 auto;padding:6px 12px;font-size:.85rem}html:not(.force-pc) .check{font-size:.88rem;padding:4px 0}html:not(.force-pc) .check input{width:18px;height:18px}html:not(.force-pc) input[type=number]{width:100px;font-size:16px}html:not(.force-pc) .tablewrap{background:transparent;border:none;overflow:visible}html:not(.force-pc) thead{display:none}html:not(.force-pc) table,html:not(.force-pc) tbody{display:block;width:100%}html:not(.force-pc) tr{display:grid;grid-template-columns:30px auto 1fr auto;grid-template-areas:"ck rk name pw" "ck w w w" "ck o o o";gap:4px 10px;
     background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 10px;margin-bottom:10px}html:not(.force-pc) tbody tr:hover{background:var(--surface)}html:not(.force-pc) tbody tr.picked{background:var(--sel);border-color:var(--gold)}html:not(.force-pc) td{display:block;border:none;padding:0;width:auto}html:not(.force-pc) td.ck{grid-area:ck;align-self:start;text-align:center;padding-top:2px}html:not(.force-pc) td.ck input{width:22px;height:22px}html:not(.force-pc) td.rank{grid-area:rk;align-self:center;width:auto;font-size:.85rem}html:not(.force-pc) td.rank::before{content:"#";opacity:.6}html:not(.force-pc) td.name{grid-area:name;align-self:center;font-size:1.05rem;line-height:1.3;min-width:0;overflow-wrap:anywhere}html:not(.force-pc) td.name .date{display:inline;margin-left:6px}html:not(.force-pc) td.pw{grid-area:pw;text-align:right;align-self:center}html:not(.force-pc) td.pw .power{font-size:1.1rem}html:not(.force-pc) td.pw .bar{width:64px;margin-left:auto}html:not(.force-pc) td.w{grid-area:w;min-width:0}html:not(.force-pc) td.w .main{font-size:.95rem}html:not(.force-pc) td.o{grid-area:o;max-width:none}html:not(.force-pc) td.o:empty{display:none}html:not(.force-pc) td.o:not(:empty)::before{content:"その他 ";color:var(--muted);font-weight:600}html:not(.force-pc) td.xc{grid-row:4;grid-column:2/4;justify-self:start}html:not(.force-pc) td.fcc{grid-row:4;grid-column:3/5;justify-self:end}html:not(.force-pc) td.xc:has(.none)+td.fcc{grid-column:2/5;justify-self:start}html:not(.force-pc) td.xc:has(.none),html:not(.force-pc) td.fcc:has(.none){display:none}html:not(.force-pc) a.x{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--accent-soft);font-size:.85rem}html:not(.force-pc) .fcc .fc{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--chip);cursor:pointer}html:not(.force-pc) .fcc .copy{display:none}html:not(.force-pc) .selbar{left:0;right:0;bottom:0;transform:none;width:100%;max-width:none;border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;grid-template-columns:1fr 1fr 1fr;gap:8px}html:not(.force-pc) .selbar.show{display:grid}html:not(.force-pc) .selbar .info{grid-column:1/-1;display:flex;gap:14px;justify-content:center}html:not(.force-pc) .selbar button{padding:9px 4px;font-size:.8rem}html:not(.force-pc) body.has-sel .totop{bottom:120px}}
/* ---------- ブキ種カラー & アイコン ---------- */
:root{--c-shooter:#2a78d6;--c-blaster:#e34948;--c-roller:#1baf7a;--c-brush:#e87ba4;--c-charger:#6250d6;--c-slosher:#eb6834;--c-spinner:#eda100;--c-dualies:#008300;--c-brella:#3f8a9c;--c-stringer:#9a6b3f;--c-splatana:#5b6474;--c-none:#9aa1ad}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c-shooter:#3987e5;--c-blaster:#e66767;--c-roller:#199e70;--c-brush:#d55181;--c-charger:#9085e9;--c-slosher:#d95926;--c-spinner:#c98500;--c-dualies:#2f9a2f;--c-brella:#4fa3b6;--c-stringer:#b9875a;--c-splatana:#8b95a7}}
:root[data-theme=dark]{--c-shooter:#3987e5;--c-blaster:#e66767;--c-roller:#199e70;--c-brush:#d55181;--c-charger:#9085e9;--c-slosher:#d95926;--c-spinner:#c98500;--c-dualies:#2f9a2f;--c-brella:#4fa3b6;--c-stringer:#b9875a;--c-splatana:#8b95a7}
.wi{display:inline-grid;place-items:center;flex:0 0 auto;border-radius:10px;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc);overflow:hidden}
.wi svg{width:74%;height:74%}
.wi img{width:100%;height:100%;object-fit:contain}
.wi.sm{width:26px;height:26px;border-radius:7px;vertical-align:middle;margin-right:6px}
.wi.md{width:56px;height:56px;border-radius:14px}
.wi.lg{width:96px;height:96px;border-radius:22px}
.wi.xs{width:20px;height:20px;border-radius:6px;vertical-align:-5px;margin-right:4px}
.cat{background:color-mix(in srgb,var(--cc,var(--accent)) 14%,transparent);color:var(--cc,var(--accent))}
td.name .nm{cursor:pointer}td.name .nm:hover{color:var(--accent);text-decoration:underline}

/* ---------- プロフィール検索 ---------- */
.finder{position:relative;margin-bottom:14px}
.finder .box{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:6px 6px 6px 16px}
.finder .box svg{width:20px;height:20px;color:var(--accent);flex:0 0 auto}
.finder input{flex:1;min-width:0;border:none;background:transparent;font:inherit;font-size:16px;padding:8px 0;color:var(--ink);outline:none}
.finder .box button{background:var(--accent);color:#fff;border:none;border-radius:11px;padding:9px 16px;font-weight:600}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.14);z-index:20;overflow:hidden;display:none;max-height:min(60vh,420px);overflow-y:auto}
.sugg.show{display:block}
.sg{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:none}
.sg.on,.sg:hover{background:var(--accent-soft)}
.sg .t{flex:1;min-width:0}
.sg .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .t small{color:var(--muted);font-size:.75rem}
.sg .p{font-weight:700;font-variant-numeric:tabular-nums}
.sg mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:3px}

/* ---------- プロフィール ---------- */
.pf-back{position:fixed;inset:0;background:rgba(10,12,18,.55);backdrop-filter:blur(3px);z-index:30;display:none;overflow-y:auto;padding:28px 16px}
.pf-back.show{display:block}
body.pf-open{overflow:hidden}
.pf{max-width:760px;margin:0 auto;background:var(--bg);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative}
.pf-hero{--cc:var(--c-none);position:relative;padding:22px 22px 20px;color:#fff;background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 55%,#111));overflow:hidden}
.pf-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.pf-hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.pf-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-bottom:14px}
.pf-top .nav{display:flex;gap:6px}
.pf-top button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 11px}
.pf-top button:hover{background:rgba(255,255,255,.3)}
.pf-id{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.pf-id .wi{background:rgba(255,255,255,.95);color:var(--cc);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.pf-name{font-size:1.8rem;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.pf-sub{opacity:.9;font-size:.85rem;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pf-sub .tag{background:rgba(255,255,255,.2);border-radius:999px;padding:1px 9px}
.pf-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}
.pf-kpi{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px}
.pf-kpi .k{font-size:.72rem;opacity:.85}
.pf-kpi .v{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.pf-kpi .v small{font-size:.75rem;font-weight:600;opacity:.85;margin-left:2px}
.pf-body{padding:18px;display:grid;gap:14px}
.pf-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.pf-sec h3{margin:0 0 10px;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.wtiles{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.wtile{--cc:var(--c-none);border-radius:14px;padding:12px;background:color-mix(in srgb,var(--cc) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 30%,var(--line));display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.wtile:hover{border-color:var(--cc)}
.wtile.empty{opacity:.45;cursor:default;background:var(--surface);border-style:dashed}
.wtile .slot{font-size:.68rem;font-weight:700;color:var(--cc);letter-spacing:.06em}
.wtile .wn{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.wtile .wc{font-size:.74rem;color:var(--muted)}
.wtile.main .wn{font-size:1.1rem}
.pf-other{margin-top:10px;font-size:.85rem;color:var(--muted)}
.pf-other b{color:var(--ink);margin-right:6px}
.catgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.catcell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.58rem;color:var(--muted);text-align:center;white-space:nowrap;letter-spacing:-.03em;min-width:0}
.catcell .wi{width:36px;height:36px;border-radius:10px;filter:grayscale(1);opacity:.35}
.catcell.on .wi{filter:none;opacity:1}
.catcell.on.main .wi{box-shadow:0 0 0 2px var(--cc)}
.catcell.on{color:var(--ink);font-weight:600}
.hist{position:relative;height:110px;display:flex;align-items:flex-end;gap:2px;margin-top:4px}
.hist .b{flex:1;background:color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:4px 4px 0 0;min-height:2px;position:relative}
.hist .b.me{background:var(--accent)}
.hist .b:hover{filter:brightness(1.1);z-index:5}
.hist .b:first-child .tip{left:0;transform:none}.hist .b:last-child .tip{left:auto;right:0;transform:none}
.hist .b .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.7rem;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:2}
.hist .b:hover .tip{display:block}
.hax{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pinfo{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;margin-bottom:8px}
.pinfo b{font-variant-numeric:tabular-nums}

function applyLayout(mode){
  NS_LAYOUT = mode;
  var h = document.documentElement;
  h.classList.toggle("force-m", mode === "m");
  h.classList.toggle("force-pc", mode === "pc");
  var vp = document.querySelector('meta[name="viewport"]');
  /* スマホでPC版を選んだときは、パソコンと同じ幅で表示して縮小する */
  if(vp) vp.setAttribute("content", (mode === "pc" && screen.width < 900) ? "width=1100" : "width=device-width,initial-scale=1");
}
function isForcedMobile(){ return NS_LAYOUT === "m"; }
function isMobileView(){ return NS_LAYOUT === "m" || (NS_LAYOUT !== "pc" && window.innerWidth <= 760); }
applyLayout(NS_LAYOUT);

  <div class="layout-sw" id="layoutSw">表示切替：<button data-l="auto">自動</button>・<button data-l="m">スマホ版</button>・<button data-l="pc">PC版</button></div>
</div>

  <span class="info"><span><b id="selN">0</b>人選択</span><span>平均 <b id="selAvg">–</b></span><span>合計 <b id="selSum">–</b></span></span>

<script>
// 予期しないエラーを画面に表示（原因を調べやすくするため）


const CATS = ["シューター","ブラスター","ローラー","フデ","チャージャー","スロッシャー","スピナー","マニューバー","シェルター","ストリンガー","ワイパー"];
// ブキ名 → ブキ種（上から順に判定）
const RULES = [
  ["ブラスター",["ブラスター","S-BLAST"]],
  ["シューター",["ジェットスイーパー","ボトルガイザー","リールガン","スペースシューター"]],
  ["チャージャー",["スクイックリン","リッター","4Kスコープ","スプラスコープ","竹筒銃","ソイチューバー","R-PEN","チャージャー"]],
  ["スロッシャー",["ヒッセン","エクスプロッシャー","モップリン","オーバーフロッシャー","スロッシャー"]],
  ["スピナー",["ハイドラント","クーゲルシュライバー","ノーチラス","イグザミナー","スピナー"]],
  ["マニューバー",["スパッタリー","ケルビン","デュアルスイーパー","クアッドホッパー","ガエンFF","マニューバー"]],
  ["シェルター",["スパイガジェット","張替傘","シェルター"]],
  ["ストリンガー",["LACT-450","フルイドV","ストリンガー"]],
  ["ワイパー",["ワイパー"]],
  ["フデ",["パブロ","ホクサイ","フィンセント"]],
  ["ローラー",["ローラー"]],
  ["シューター",["シューター","マーカー","プロモデラー","ガロン","N-ZAP","ZAP","もみじ","わかば"]],
];
function catOf(w){ if(!w) return ""; const t=norm(w); for(const [c,keys] of RULES) if(keys.some(k=>t.includes(norm(k)))) return c; return ""; }
// 検索用の正規化：全角半角・大文字小文字・ひらがなカタカナを同一視
function norm(s){ return String(s).normalize("NFKC").toLowerCase().replace(/[ぁ-ゖ]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0x60)); }

const PRESETS = [["3200+",3200,null],["3000〜3199",3000,3199.9],["2800〜2999",2800,2999.9],["2600〜2799",2600,2799.9],["〜2599",null,2599.9]];
const DAY = 864e5;
let members = [], timer = null;
const st = { cats:new Set(), picked:new Set() };
const $ = id => document.getElementById(id);
const X_URL = "https:\/\/x.com/"; /* スラッシュ2つを直接書かないための書き方 */
const esc = s => String(s).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),1400); }
function setStatus(kind, text){ $("dot").className = "dot " + kind; $("statusText").textContent = text; }

/* ---------- 読み込み ---------- */
// Apps Script のサーバー側（コード.gs の getData）からシートの内容を受け取る
function toTable(d){ return { cols: d.cols.map(l=>({label:l})), rows: d.rows.map(r=>({c:r})) }; }
let loadTimer = null;
let apiImages = null, lastLoaded = 0, usedLocal = false;
const LOCAL_KEY = "nsRosterCache";
/* 前回のデータをこの端末に保存しておき、次に開いたとき通信を待たずにすぐ表示する */
function showLocalCache(){
  try{
    const c = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
    if(!c || !c.d || !c.d.data) return false;
    setResults(c.d.results); setFormInfo(c.d.form);
    parse(toTable(c.d.data));
    if(c.d.images && typeof applyImages === "function") applyImages(c.d.images);
    setStatus("load", "前回（" + new Date(c.t).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) + "）のデータを表示中・最新を読み込み中…");
    return true;
  }catch(_e){ return false; }
}
function load(){
  if(!members.length && !usedLocal){ usedLocal = true; showLocalCache(); }
  const url = String(window.ROSTER_API || "");
  if(!/^https:/.test(url) || url.indexOf("script.google.com") < 0){ fail("index.html の ROSTER_API に Apps Script のURLが設定されていません"); return; }
  if(!members.length) setStatus("load", "読み込み中…");
  clearTimeout(loadTimer);
  loadTimer = setTimeout(()=>fail("サーバーから応答がありません（時間をおいて開き直してください）"), 30000);
  fetch(url + (url.indexOf("?")<0 ? "?" : "&") + "api=data&t=" + Date.now(), { credentials: "omit", cache: "no-store", redirect: "follow" })
    .then(r=>{ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(txt=>{
      clearTimeout(loadTimer);
      let d; try{ d = JSON.parse(txt); }catch(_e){ throw new Error("データの形式が正しくありません（Apps Script のアクセス設定が「全員」になっているか確認してください）"); }
      if(d.error) throw new Error(d.error);
      setResults(d.results); setFormInfo(d.form);
      parse(toTable(d.data));
      lastLoaded = Date.now();
      setStatus("ok", "最終更新 " + new Date().toLocaleTimeString("ja-JP"));
      try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({t: lastLoaded, d: d})); }catch(_e){}
      if(d.images){ apiImages = d.images; if(typeof applyImages === "function") applyImages(d.images); }
    })
    .catch(e=>{ clearTimeout(loadTimer); fail(e && e.message ? e.message : String(e)); });
}
function fail(msg){
  if(members.length){ setStatus("err", "自動更新に失敗しました（表示は前回のデータです）：" + msg); return; }
  setStatus("err", "読み込みに失敗しました：" + msg);
  $("rows").innerHTML = `<tr><td colspan="8" class="msg">読み込みに失敗しました<br><small>${esc(String(msg))}</small></td></tr>`;
}
const val = c => (c && c.v != null) ? c.v : "";
const str = c => { const v = c ? (c.f != null ? c.f : c.v) : ""; return v == null ? "" : String(v).trim(); };
function time(c){
  const v = val(c); if(typeof v === "string"){ const m = v.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
    if(m) return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)).getTime();
    const d = Date.parse(v.split("/").join("-")); if(!isNaN(d)) return d; }
  return 0;
}
function xId(s){ s = s.trim().replace(new RegExp("^https?:\\/\\/(www\\.)?(x|twitter)\\.com\\/","i"),"").replace(/^[@＠]/,"").split(/[/?\s]/)[0]; return /^[A-Za-z0-9_]{1,15}$/.test(s) ? s : ""; }

/* ---------- 主な浮上時間帯（フォームのチェックボックスグリッド） ---------- */
const DAYS = ["日","月","火","水","木","金","土"];
const SLOTS = [[0,1],[1,3],[3,6],[6,17],[17,19],[19,21],[21,22],[22,23],[23,24]];
function slotsOf(text){   /* "0時～1時, 21時～22時" → [0,6] */
  const out = [];
  String(text).normalize("NFKC").split(/[,、]/).forEach(part=>{
    const mm = part.match(/(\d+)\s*時/); if(!mm) return;
    const h = +mm[1]; let i = SLOTS.findIndex(sl=>sl[0]===h);
    if(i < 0) i = SLOTS.findIndex(sl=>h>=sl[0] && h<sl[1]);
    if(i >= 0 && out.indexOf(i) < 0) out.push(i);
  });
  return out;
}
function nowJST(){ const d = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"})); return {day:d.getDay(), hour:d.getHours(), min:d.getMinutes()}; }
function onlineNow(m){
  if(!m.sched) return false; const n = nowJST();
  const i = SLOTS.findIndex(sl=>n.hour>=sl[0] && n.hour<sl[1]);
  return i>=0 && m.sched[n.day].indexOf(i)>=0;
}
function schedHours(m){ let t=0; if(m.sched) m.sched.forEach(d=>d.forEach(i=>{ t += SLOTS[i][1]-SLOTS[i][0]; })); return t; }
function schedOverlap(a, b){   /* 共通して浮上している時間 ÷ どちらかが浮上している時間 */
  if(!a.sched || !b.sched) return 0; let both=0, any=0;
  for(let d=0; d<7; d++) SLOTS.forEach((sl,i)=>{ const x=a.sched[d].indexOf(i)>=0, y=b.sched[d].indexOf(i)>=0, w=sl[1]-sl[0]; if(x&&y) both+=w; if(x||y) any+=w; });
  return any ? both/any : 0;
}

function parse(table){
  const labels = table.cols.map(c=>(c.label||"").replace(/\s/g,""));
  const find = (keys, fb) => { const i = labels.findIndex(l=>keys.some(k=>l.includes(k))); return i>=0 ? i : fb; };
  const C = {
    ts: find(["タイムスタンプ"],0), name: find(["名前"],1), power: find(["最高パワー"],2), main: find(["メインブキ"],3),
    sub1: find(["サブブキ1"],4), sub2: find(["サブブキ2"],5), other: find(["その他"],6),
    x: find(["Twitter","XID"],7), fc: find(["フレンドコード"],8), flag: find(["列1"],11)
  };
  const hasFlag = table.rows.some(r=>str((r.c||[])[C.flag])==="抽出");
  const GRID = DAYS.map(d=>labels.findIndex(l=>l.indexOf("浮上")>=0 && (l.indexOf("["+d+"]")>=0 || l.indexOf("［"+d+"］")>=0)));
  // 更新は「変えた項目だけ」回答する運用：同じ名前の回答を古い順に重ね、空欄は前の値を引き継ぐ
  const CLEAR = /^(なし|無し|ナシ|-|ー|−|―|—|削除)$/;   // この値が入っていたら、その項目を空にする
  const FIELDS = ["power","main","sub1","sub2","other","x","fc"];
  const groups = new Map();
  for(const r of table.rows){
    const c = r.c || [];
    const name = str(c[C.name]);
    if(!name || name === "#N/A") continue;
    const k = norm(name);
    if(!groups.has(k)) groups.set(k, {rows:[], flagged:false});
    const g = groups.get(k);
    g.rows.push({ name, ts: time(c[C.ts]), c });
    if(str(c[C.flag]) === "抽出") g.flagged = true;
  }
  members = [];
  for(const [k, g] of groups){
    if(hasFlag && !g.flagged) continue;   // 「抽出」が1つも付いていない人は名簿に出さない
    g.rows.sort((a,b)=>a.ts-b.ts);
    const cur = {}, hist = [], log = [];
    for(const row of g.rows){
      const c = row.c, changes = [];
      for(const f of FIELDS){
        const v = str(c[C[f]]);
        if(v === "") continue;               // 空欄＝変更なし
        const nv = CLEAR.test(v) ? "" : v;
        if((cur[f]||"") !== nv) changes.push({f:f, from:cur[f]||"", to:nv});
        cur[f] = nv;
      }
      const pw = parseFloat(val(c[C.power]));
      if(row.ts && pw) hist.push({ts: row.ts, power: pw});
      /* 浮上時間帯は表全体で1つの項目：どれか1日でも答えていれば、その回答の表で丸ごと置き換える */
      const days = GRID.map(ci=>ci>=0 ? str(c[ci]) : "");
      if(days.some(v=>v!=="")){ cur.sched = days.map(v=>slotsOf(v)); changes.push({f:"sched"}); }
      log.push({ts: row.ts, changes: changes});
    }
    const last = g.rows[g.rows.length-1];
    const m = {
      name: last.name, key: k,
      power: parseFloat(cur.power) || 0,
      ts: g.rows[0].ts, updTs: last.ts,       // ts＝最初の登録日、updTs＝最後に更新した日
      main: cur.main||"", sub1: cur.sub1||"", sub2: cur.sub2||"", other: cur.other||"",
      xRaw: cur.x||"", x: xId(cur.x||""), fc: cur.fc||"",
      sched: cur.sched || null, log: log
    };
    m.mainCat = catOf(m.main);
    m.allCats = [...new Set([m.main,m.sub1,m.sub2].map(catOf).filter(Boolean))];
    m.hay = norm([m.name,m.main,m.sub1,m.sub2,m.other,m.xRaw,m.fc,m.mainCat].join(" "));
    const seen = new Set();
    m.hist = hist.filter(h=>{ const id=h.ts+":"+h.power; if(seen.has(id)) return false; seen.add(id); return true; });
    members.push(m);
  }
  members.sort((a,b)=>b.power-a.power);
  members.forEach((m,i)=>m.rank=i+1);
  const names = new Set(members.map(m=>m.key)); for(const k of [...st.picked]) if(!names.has(k)) st.picked.delete(k);
  renderChips(); render();
  if(typeof onRosterData==="function") onRosterData();
}

/* ---------- 絞り込み ---------- */
const slotAny = () => document.querySelector('input[name=slot]:checked').value === "any";
function catsOf(m){ return slotAny() ? m.allCats : (m.mainCat ? [m.mainCat] : []); }
function renderChips(){
  const counts = Object.fromEntries(CATS.map(c=>[c, members.filter(m=>catsOf(m).includes(c)).length]));
  $("chips").innerHTML = `<button class="chip${st.cats.size?'':' on'}" data-cat="">すべて<span class="n">${members.length}</span></button>` +
    CATS.filter(c=>counts[c]).map(c=>`<button class="chip${st.cats.has(c)?' on':''}" data-cat="${c}">${c}<span class="n">${counts[c]}</span></button>`).join("");
  const pmin = $("pmin").value, pmax = $("pmax").value;
  $("presets").innerHTML = PRESETS.map(([l,a,b])=>`<button class="chip${String(a==null?"":a)===pmin && String(b==null?"":b)===pmax?' on':''}" data-a="${a==null?"":a}" data-b="${b==null?"":b}">${l}</button>`).join("");
}
function parseQuery(q){
  const inc=[], exc=[];
  for(const t of norm(q).split(/\s+/).filter(Boolean)){ if(t.startsWith("-") && t.length>1) exc.push(t.slice(1)); else inc.push(t); }
  return {inc, exc};
}
function filtered(){
  const {inc, exc} = parseQuery($("q").value);
  const pmin = parseFloat($("pmin").value), pmax = parseFloat($("pmax").value);
  const and = $("andCats").checked, now = Date.now();
  return members.filter(m=>{
    if(st.cats.size){ const cs = catsOf(m); const hit = [...st.cats][and?"every":"some"](c=>cs.includes(c)); if(!hit) return false; }
    if(!isNaN(pmin) && m.power < pmin) return false;
    if(!isNaN(pmax) && m.power > pmax) return false;
    if($("hasX").checked && !m.xRaw) return false;
    if($("hasFC").checked && !m.fc) return false;
    if($("newOnly").checked && !(m.ts && now - m.ts < 7*DAY)) return false;
    if($("pickedOnly").checked && !st.picked.has(m.key)) return false;
    if($("nowOnline").checked && !onlineNow(m)) return false;
    if($("favOnly").checked && !isFav(m)) return false;
    if($("staleOnly").checked && !isStale(m)) return false;
    if(inc.some(t=>!m.hay.includes(t))) return false;
    if(exc.some(t=>m.hay.includes(t))) return false;
    return true;
  });
}
function sorted(list){
  const [k,dir] = $("sort").value.split(":"); const d = dir==="asc"?1:-1;
  const ci = c => { const i = CATS.indexOf(c); return i<0 ? 99 : i; };
  const f = {
    power:(a,b)=>a.power-b.power,
    name:(a,b)=>a.name.localeCompare(b.name,"ja"),
    main:(a,b)=>a.main.localeCompare(b.main,"ja")||b.power-a.power,
    cat:(a,b)=>ci(a.mainCat)-ci(b.mainCat)||b.power-a.power,
    ts:(a,b)=>a.ts-b.ts
  }[k];
  return [...list].sort((a,b)=>d*f(a,b));
}

/* ---------- 描画 ---------- */
/* ---------- 大会結果（スプレッドシート「大会結果（手入力）」） ---------- */
let RESULTS = {};
function resultType(title){ return /準優勝/.test(title) ? "second" : /優勝/.test(title) ? "win" : /出場/.test(title) ? "entry" : "other"; }
function setResults(list){
  RESULTS = {};
  (list || []).forEach((r, idx)=>{
    const keys = r.names.map(n=>norm(n));
    keys.forEach((k, i)=>{ (RESULTS[k] = RESULTS[k] || []).push({ title: r.title, type: resultType(r.title), mates: r.names.filter((_, j)=>j!==i), idx }); });
  });
}
function awardsOf(m){ return RESULTS[m.key] || []; }
function winsOf(m){ return awardsOf(m).filter(a=>a.type==="win").length; }
const TROPHY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1.2 1.8A5 5 0 0 1 7 9zm10 0v2c0 .3 0 .5-.1.8A2 2 0 0 0 18 8V7z"/><rect x="7" y="20" width="10" height="2" rx="1" fill="currentColor"/></svg>';
function trophyBadge(m){ const n = winsOf(m); return n ? `<span class="tro" title="大会優勝 ${n}回">${TROPHY_SVG}${n > 1 ? n : ""}</span>` : ""; }

/* スマホ版の一覧（コンパクト表示）：順位・メインブキ・名前・XP・サブブキ1/2 を1人1行で */
function mobileCard(m, isNew){
  if(typeof wIcon !== "function") return "";
  const rk = m.rank <= 3 ? `<span class="mrk md${m.rank}">${m.rank}</span>` : `<span class="mrk">${m.rank}</span>`;
  const subs = [m.sub1, m.sub2].filter(Boolean).map((w,i)=>`<span class="msub">${wIcon(w, catOf(w), "xs")}${esc(w)}</span>`).join("");
  return `<div class="mc">${rk}${wIcon(m.main, m.mainCat, "md")}
    <div class="mt"><b>${isFav(m)?'<i class="mfav">★</i>':''}${esc(m.name)}${onlineNow(m)?'<i class="mon" title="今は主な浮上時間帯です"></i>':''}${isNew?'<span class="newb">NEW</span>':''}</b>
      <small class="mw">${esc(m.main) || "メインブキ未登録"}</small>
      ${subs ? `<small class="ms">${subs}</small>` : ""}</div>
    <span class="mp">${m.power || "–"}</span></div>`;
}
const avg = a => a.length ? (a.reduce((x,y)=>x+y,0)/a.length) : NaN;
const fmt = n => isNaN(n) ? "–" : (Math.round(n*10)/10).toString();
function median(a){ if(!a.length) return NaN; const s=[...a].sort((x,y)=>x-y), h=s.length>>1; return s.length%2 ? s[h] : (s[h-1]+s[h])/2; }
let shown = [];
function render(){
  shown = sorted(filtered());
  if(typeof isFav === "function"){ const fv = shown.filter(isFav); if(fv.length) shown = fv.concat(shown.filter(m=>!isFav(m))); }
  const pw = members.map(m=>m.power).filter(Boolean), spw = shown.map(m=>m.power).filter(Boolean);
  const max = Math.max(...pw), min = Math.min(...pw), now = Date.now();
  $("sCount").textContent = members.length + "人";
  $("sAvg").textContent = fmt(avg(pw));
  $("sMed").textContent = fmt(median(pw));
  $("sShown").textContent = shown.length + "人";
  $("sShownAvg").textContent = fmt(avg(spw));
  $("shownM").textContent = `${shown.length}人を表示中` + (spw.length ? `（平均 ${fmt(avg(spw))}）` : "");
  const nf = st.cats.size + (($("pmin").value||$("pmax").value)?1:0) + ["hasX","hasFC","newOnly","pickedOnly","nowOnline","favOnly","staleOnly"].filter(id=>$(id).checked).length + (slotAny()?1:0);
  $("fcount").textContent = nf || "";

  const [sk,sd] = $("sort").value.split(":");
  document.querySelectorAll("th.s").forEach(th=>{ const on = th.dataset.k===sk && !(th.classList.contains("rank")); th.classList.toggle("on",on); th.classList.toggle("asc",on&&sd==="asc"); });

  if(!shown.length){ $("rows").innerHTML = `<tr><td colspan="8" class="empty">条件に合うメンバーがいません<br><button class="empty-reset" onclick="document.getElementById('clear').click()">条件をリセット</button></td></tr>`; }
  else $("rows").innerHTML = shown.map(m=>{
    const pct = max>min ? Math.max(4, (m.power-min)/(max-min)*100) : 100;
    const w = s => s ? `<span class="wlink" data-q="${esc(s)}">${esc(s)}</span>` : "";
    const subs = [m.sub1,m.sub2].filter(Boolean).map(w).join(" / ");
    const isNew = m.ts && now - m.ts < 7*DAY;
    const date = m.ts ? new Date(m.ts).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"}) + " 登録" : "";
    const x = m.x ? `<a class="x" href="${X_URL}${m.x}" target="_blank" rel="noopener">@${esc(m.x)}</a>` : (m.xRaw ? esc(m.xRaw) : `<span class="none">—</span>`);

    const picked = st.picked.has(m.key);
    return `<tr class="${picked?'picked':''}" data-key="${esc(m.key)}">
      <td class="ck"><input type="checkbox" class="pick" ${picked?"checked":""}></td>
      <td class="rank r${m.rank}">${m.rank}</td>
      <td class="name"><button class="fav${isFav(m)?' on':''}" data-fav="${esc(m.key)}" title="${isFav(m)?'お気に入りから外す':'お気に入りに追加（一覧の上に表示）'}">${isFav(m)?'★':'☆'}</button><span class="nm" title="プロフィールを見る">${esc(m.name)}</span>${onlineNow(m)?'<span class="onl" title="今は主な浮上時間帯です"></span>':''}${isNew?'<span class="newb">NEW</span>':''}<div class="date">${date}</div></td>
      <td class="pw"><div class="power">${m.power || "–"}</div></td>
      <td class="w">${typeof wIcon==="function"?wIcon(m.main,m.mainCat,"sm"):""}<span class="main">${w(m.main)||"–"}</span>${m.mainCat?`<span class="cat" style="--cc:${catVar(m.mainCat)}" data-cat="${m.mainCat}">${m.mainCat}</span>`:""}${subs?`<div class="subs">${subs}</div>`:""}</td>
      <td class="o other">${esc(m.other)}</td>
      <td class="xc">${x}</td>
      <td class="fcc">${fc}</td>
      <td class="mcard">${mobileCard(m, isNew)}</td>
    </tr>`;
  }).join("");
  $("pickAll").checked = shown.length>0 && shown.every(m=>st.picked.has(m.key));
  renderSel(); save();
}
function renderSel(){

}

async function copy(text, msg){
  try{ await navigator.clipboard.writeText(text); }
  catch(_e){ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast(msg || "コピーしました");
}

  const svg = `<svg viewBox="0 0 32 32" aria-hidden="true">${ICONS[CAT_KEY[cat]||"none"]}</svg>`;

function applyImages(list){

/* ===== 名前検索（候補表示） ===== */
let suggIdx = 0, suggList = [];
function scoreName(m, q){
  const n = m.key; if(n===q) return 0; if(n.startsWith(q)) return 1; if(n.includes(q)) return 2;
  let i=0; for(const ch of n){ if(ch===q[i]) i++; if(i===q.length) return 3; } return -1; // あいまい（文字順一致）
}
function hl(name, q){
  const n = norm(name), i = n.indexOf(q);
  return i<0 || name.length!==n.length ? esc(name) : esc(name.slice(0,i)) + "<mark>" + esc(name.slice(i,i+q.length)) + "</mark>" + esc(name.slice(i+q.length));
}
function updateSugg(){
  const q = norm($("q").value.trim());
  if(!q || /\s/.test(q) || q.charAt(0)==="-"){ $("sugg").classList.remove("show"); suggList=[]; return; }
  suggList = members.map(m=>[m,scoreName(m,q)]).filter(x=>x[1]>=0 && x[1]<=2).sort((a,b)=>a[1]-b[1]||b[0].power-a[0].power).slice(0,5).map(x=>x[0]);
  suggIdx = -1; suggArmed = false;
  $("sugg").innerHTML = suggList.length ? suggList.map((m,i)=>`<div class="sg" data-key="${esc(m.key)}">${wIcon(m.main,m.mainCat,"md").replace('class="wi md"','class="wi md" style="width:38px;height:38px;border-radius:10px;--cc:'+catVar(m.mainCat)+'"')}<div class="t"><b>${hl(m.name,q)}</b><small>${esc(m.main||"")}${m.mainCat?" ・ "+m.mainCat:""}</small></div><span class="p">${m.power||"–"}</span></div>`).join("")
                                       : "";
  if(!suggList.length){ $("sugg").classList.remove("show"); return; }
  $("sugg").innerHTML = `<div class="sg-h">プロフィールを開く<span>↑↓で選んでEnter</span></div>` + $("sugg").innerHTML;
  $("sugg").classList.add("show");
}
function moveSugg(d){ if(!suggList.length) return; suggArmed = true; suggIdx = suggIdx<0 ? (d>0?0:suggList.length-1) : (suggIdx+d+suggList.length)%suggList.length; const items = $("sugg").querySelectorAll(".sg[data-key]"); items.forEach((e,i)=>e.classList.toggle("on",i===suggIdx)); items[suggIdx].scrollIntoView({block:"nearest"}); }
function pickSugg(m){ if(!m) return; $("sugg").classList.remove("show"); $("q").blur(); openProfile(m); }
let suggArmed = false;   /* 矢印キーで候補を選んだときだけ Enter でプロフィールを開く */
$("q").addEventListener("input", updateSugg);
$("q").addEventListener("focus", updateSugg);
$("q").addEventListener("keydown", e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); moveSugg(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveSugg(-1); }
  else if(e.key==="Enter"){ if(e.isComposing) return; e.preventDefault(); if(suggArmed && suggIdx>=0) pickSugg(suggList[suggIdx]); else if(suggList.length===1 && norm($("q").value.trim())===suggList[0].key) pickSugg(suggList[0]); else { $("sugg").classList.remove("show"); $("q").blur(); } }
  else if(e.key==="Escape"){ $("sugg").classList.remove("show"); }
});
$("sugg").addEventListener("mousedown", e=>{ const r=e.target.closest(".sg[data-key]"); if(r){ e.preventDefault(); pickSugg(members.find(m=>m.key===r.dataset.key)); } });

/* ブラウザの「戻る」でプロフィールを閉じられるようにする */
const GH = {

  replace: (st, _p, h)=>history.replaceState(st, "", h ? "#" + h : location.pathname + location.search),

  const note = h.length<2 ? `<div class="xp-note">記録が1回分だけです。フォームにもう一度回答すると、その時点のXPが追加されて推移が見られるようになります。</div>` : "";
  xpData = {h: pts0, pts, W};
  return stats + `<div class="xpc">${svg}<div class="xptip"></div></div>` + note + tbl;
}
let xpData = null;
function xpHover(e){
  const box = e.target.closest(".xpc"); if(!box || !xpData) return;
  const svg = box.querySelector("svg"), r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * xpData.W / r.width;
  let bi = 0; xpData.pts.forEach((p,i)=>{ if(Math.abs(p[0]-sx) < Math.abs(xpData.pts[bi][0]-sx)) bi = i; });
  const p = xpData.pts[bi], d = xpData.h[bi], k = r.width / xpData.W, prev = xpData.h[bi-1];
  box.classList.add("hov");
  const g = svg.querySelector(".guide"); g.setAttribute("x1", p[0]); g.setAttribute("x2", p[0]);
  svg.querySelectorAll(".pt").forEach((c,i)=>c.classList.toggle("hl", i===bi));
  const tip = box.querySelector(".xptip");
  tip.innerHTML = d.today ? `今日<br><b>${d.power}</b>（最新の記録）`
    : `${d.early ? "2026/10/1（それ以前の記録）" : new Date(d.ts).toLocaleDateString("ja-JP",{year:"numeric",month:"numeric",day:"numeric"})}<br><b>${d.power}</b>${prev && !prev.today?`（${d.power-prev.power>=0?"+":""}${fmt(d.power-prev.power)}）`:""}`;
  /* 吹き出しがグラフの外にはみ出さないよう、実際の幅を測って左右・上下の位置を調整する */
  tip.style.left = "0px";
  const tw = Math.min(tip.offsetWidth, r.width), th = tip.offsetHeight;
  /* 吹き出しの左端を px で直接決める（点を中心にしつつ、左右どちらにもはみ出さない） */
  const lx = Math.max(0, Math.min(p[0]*k - tw/2, r.width - tw));
  tip.style.left = lx + "px"; tip.style.top = (p[1]*k) + "px";
  tip.classList.toggle("below", p[1]*k < th + 12);
}
$("pf").addEventListener("pointermove", xpHover);
$("pf").addEventListener("pointerdown", xpHover);
$("pf").addEventListener("pointerleave", e=>{ if(!e.target.classList || !e.target.classList.contains("xpc")) return; const b = e.target; if(b){ b.classList.remove("hov"); b.querySelectorAll(".pt").forEach(c=>c.classList.remove("hl")); } }, true);

/* ===== 浮上時間帯の表示 ===== */
function rangesText(idxs){   /* [5,6,7] → "19〜23時" のように隣り合う枠をつなげる */
  const sorted = idxs.slice().sort((a,b)=>a-b), out = [];
  sorted.forEach(i=>{ const last = out[out.length-1]; if(last && last[1]===SLOTS[i][0]) last[1]=SLOTS[i][1]; else out.push([SLOTS[i][0], SLOTS[i][1]]); });
  return out.map(r=>r[0]+"〜"+r[1]+"時").join("、");
}
function schedSummary(m){
  const lines = [], wk=[1,2,3,4,5], we=[0,6];
  const common = (days, need)=>SLOTS.map((_,i)=>i).filter(i=>days.filter(d=>m.sched[d].indexOf(i)>=0).length>=need);
  const a = common(wk, 3), b = common(we, 1);
  if(a.length) lines.push(`<span><b>平日</b> ${rangesText(a)}</span>`);
  if(b.length) lines.push(`<span><b>土日</b> ${rangesText(b)}</span>`);
  return lines.join("");
}
/* 時刻 → 横位置(%)。長い枠（6〜17時など）は縮め、夜の短い枠を見やすくする */
const SLOT_W = [1, 1.3, 1.3, 2, 1.3, 1.3, 1, 1, 1];
function tpos(h){
  const total = SLOT_W.reduce((a,b)=>a+b,0); let x = 0;
  for(let i=0; i<SLOTS.length; i++){
    const sl = SLOTS[i];
    if(h <= sl[1]){ x += SLOT_W[i] * Math.max(0, h - sl[0]) / (sl[1] - sl[0]); return x/total*100; }
    x += SLOT_W[i];
  }
  return 100;
}
function schedSection(m){
  if(!m.sched) return `<div class="xp-note">まだ回答がありません。</div>`;
  const n = nowJST(), on = onlineNow(m), hrs = schedHours(m);
  const nowPct = tpos(n.hour + n.min/60);
  const lines = SLOTS.slice(1).map(sl=>`<u style="left:${tpos(sl[0])}%"></u>`).join("");
  const rows = [1,2,3,4,5,6,0].map(d=>{
    const rg = []; m.sched[d].slice().sort((x,y)=>x-y).forEach(i=>{ const l = rg[rg.length-1]; if(l && l[1]===SLOTS[i][0]) l[1]=SLOTS[i][1]; else rg.push([SLOTS[i][0], SLOTS[i][1]]); });
    const blocks = rg.map(r=>`<i style="left:${tpos(r[0])}%;width:${tpos(r[1])-tpos(r[0])}%" title="${DAYS[d]} ${r[0]}〜${r[1]}時"></i>`).join("");
    const today = d===n.day;
    return `<div class="sc-row${today?' today':''}"><span class="sc-d${d===0?' sun':d===6?' sat':''}">${DAYS[d]}</span><div class="sc-track">${lines}${blocks}${today?`<b class="sc-now" style="left:${nowPct}%"></b>`:""}</div></div>`;
  }).join("");
  const axis = `<div class="sc-row sc-axis"><span></span><div class="sc-track">${[0,3,6,17,19,21,24].map(h=>`<em style="left:${tpos(h)}%">${h}</em>`).join("")}</div></div>`;
  return `<div class="sc-head">${on?'<span class="sc-on">今は浮上していることが多い時間帯です</span>':""}${schedSummary(m)}<span class="sc-tot">週 約${hrs}時間</span></div>
    <div class="sc">${rows}${axis}</div>`;
}

function onRosterData(){
  updateMeBtn();
  if(cur){ const m = members.find(x=>x.key===cur.key); m ? openProfile(m, true) : closeProfile(); }
  else if(startHash.startsWith("p=")){ const k = norm(decodeURIComponent(startHash.slice(2))); startHash = ""; const m = members.find(x=>x.key===k); if(m) openProfile(m); }
  if($("sugg").classList.contains("show")) updateSugg();
  if(typeof onToolsData==="function") onToolsData();
}
loadImages(); setInterval(loadImages, 10*60000);

<script>

/* ---------- お気に入り（この端末に保存） ---------- */

/* ---------- 情報が古い人 ---------- */

/* ---------- ツール用の画面（共通） ---------- */
let tlRender = null, tlSkipPop = false;

$("tlback").addEventListener("change", e=>{ const a = e.target.closest("[data-tlc]"); if(a && TL_ACTS[a.dataset.tlc]) TL_ACTS[a.dataset.tlc](a); });
const segBtns = (act, list, curV) => `<span class="seg">${list.map(o=>`<button data-tl="${act}" data-v="${o[0]}" class="${String(o[0])===String(curV)?'on':''}">${o[1]}</button>`).join("")}</span>`;
const dLong = t => new Date(t).toLocaleDateString("ja-JP", {year:"numeric", month:"numeric", day:"numeric", weekday:"short"});

/* ---------- 最近の動き（新規登録・更新） ---------- */
const F_LABEL = {power:"XP", main:"メイン", sub1:"サブ1", sub2:"サブ2", other:"その他ブキ", x:"X ID", fc:"フレコ", sched:"浮上時間帯"};
let recentDays = 14;
function recentEvents(days){
  const since = Date.now() - days*DAY, out = [];
  members.forEach(m=>(m.log || []).forEach((e, i)=>{ if(e.ts && e.ts >= since) out.push({m: m, ts: e.ts, isNew: i===0, changes: e.changes}); }));
  return out.sort((a,b)=>b.ts-a.ts);
}
function changeText(c){
  if(c.f==="power") return `<span>XP ${c.from ? esc(c.from) + " → " : ""}<b>${esc(c.to) || "削除"}</b></span>`;
  if(c.f==="main" || c.f==="sub1" || c.f==="sub2") return `<span>${F_LABEL[c.f]} ${c.to ? `→ <b>${esc(c.to)}</b>` : "を削除"}</span>`;
  if(c.f==="sched") return `<span>浮上時間帯を更新</span>`;
  return `<span>${F_LABEL[c.f]}を${c.to ? "更新" : "削除"}</span>`;
}
function recentBody(){
  const ev = recentEvents(recentDays);
  let html = `<div class="row">${segBtns("rdays", [[7,"7日"],[14,"14日"],[30,"30日"]], recentDays)}<span class="tsum">新規 <b>${ev.filter(x=>x.isNew).length}</b> 件・更新 <b>${ev.filter(x=>!x.isNew).length}</b> 件</span></div>`;
  if(!ev.length) return html + `<div class="pf-sec"><div class="tl-empty">この期間の登録・更新はありません</div></div>`;

  ev.forEach(x=>{
    const day = new Date(x.ts).toDateString();

    const detail = x.isNew

      : (x.changes.length ? x.changes.map(changeText).join("") : "<span>変更なし（同じ内容で回答）</span>");
    list += `<div class="tl-row">${personChip(x.m)}<span class="bdg ${x.isNew?'new':'upd'}">${x.isNew?'新規登録':'更新'}</span><div class="grow chg">${detail}</div></div>`;
  });
  return html + `<div class="pf-sec">${list}</div>`;
}
TL_ACTS.rdays = a=>{ recentDays = +a.dataset.v; tlRender(); };
function openRecent(){ openTool("最近の動き", "名簿への新規登録と情報の更新", recentBody); }

/* ---------- XPが伸びた人 ---------- */
let growthMode = "range";
const ymd = t => { const d = new Date(t), z = n => (n < 10 ? "0" : "") + n; return d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()); };
const parseYmd = s => { const a = String(s).split("-").map(Number); return a.length === 3 && a[0] ? new Date(a[0], a[1]-1, a[2]).getTime() : NaN; };
let gFrom = ymd(XP_START), gTo = ymd(Date.now());
function growthList(mode){
  let t0 = parseYmd(gFrom), t1 = parseYmd(gTo) + DAY - 1;
  if(isNaN(t0)) t0 = XP_START; if(isNaN(t1)) t1 = Date.now();
  if(t0 > t1){ const t = t0; t0 = t1 - DAY + 1; t1 = t + DAY - 1; }
  return members.map(m=>{
    const h = xpRecords(m); if(!h.length) return null;
    let a, b;
    if(mode === "prev"){ if(h.length < 2) return null; a = h[h.length-2]; b = h[h.length-1]; }
    else {
      /* 期間の初めのXP＝開始日までの最後の記録（なければ期間内の最初の記録）、終わりのXP＝終了日までの最後の記録 */
      const before = h.filter(p=>p.ts <= t0), inside = h.filter(p=>p.ts > t0 && p.ts <= t1);
      if(!inside.length) return null;
      a = before.length ? before[before.length-1] : inside[0]; b = inside[inside.length-1];
      if(a === b) return null;
    }
    return {m: m, from: a, to: b, d: b.power - a.power};
  }).filter(x=>x && x.d > 0).sort((x,y)=>y.d-x.d || y.to.ts-x.to.ts);
}
function growthBody(){
  const list = growthList(growthMode);

TL_ACTS.gmode = a=>{ growthMode = a.dataset.v; tlRender(); };
TL_ACTS.gfrom = a=>{ if(a.value) gFrom = a.value; tlRender(); };
TL_ACTS.gto = a=>{ if(a.value) gTo = a.value; tlRender(); };

/* ---------- 情報が古い人 ---------- */
function staleBody(){

/* ---------- 浮上時間のヒートマップ（統計・重なりで共通） ---------- */
const DAY_ORDER = [1,2,3,4,5,6,0];
let hgList = [], hgAll = false;
function heatGrid(list, markAll){
  hgList = list.filter(m=>m.sched); hgAll = markAll;
  const N = hgList.length; if(!N) return `<div class="xp-note">浮上時間帯の回答がありません。</div>`;
  let mx = 1; const cnt = {};
  DAY_ORDER.forEach(d=>SLOTS.forEach((_,i)=>{ const n = hgList.filter(m=>m.sched[d].indexOf(i)>=0).length; cnt[d+"_"+i] = n; if(n > mx) mx = n; }));
  const cols = "26px " + SLOT_W.map(w=>w+"fr").join(" ");
  let h = `<div class="hg" style="grid-template-columns:${cols}"><span></span>${SLOTS.map(sl=>`<span class="hh">${sl[0]}-${sl[1]}</span>`).join("")}`;
  DAY_ORDER.forEach(d=>{
    h += `<span class="hd${d===0?' sun':d===6?' sat':''}">${DAYS[d]}</span>`;
    SLOTS.forEach((sl,i)=>{
      const n = cnt[d+"_"+i], p = Math.round(n/mx*85);
      h += `<button class="hc${n===0?' zero':''}${p>50?' dk':''}${markAll && n===N && N>1?' all':''}" style="--p:${p}%" data-tl="hcell" data-d="${d}" data-i="${i}" title="${DAYS[d]} ${sl[0]}〜${sl[1]}時：${n}人">${n}</button>`;
    });
  });
  return h + `</div><div class="hg-detail" id="hgDetail"><span class="tsum">マスを押すと、その時間に浮上している人が表示されます</span></div>`;
}
TL_ACTS.hcell = a=>{
  const d = +a.dataset.d, i = +a.dataset.i, sl = SLOTS[i];
  document.querySelectorAll(".hc.sel").forEach(x=>x.classList.remove("sel")); a.classList.add("sel");
  const on = hgList.filter(m=>m.sched[d].indexOf(i)>=0), off = hgList.filter(m=>m.sched[d].indexOf(i)<0);
  $("hgDetail").innerHTML = `<b>${DAYS[d]}曜 ${sl[0]}〜${sl[1]}時</b>：${on.length}人

    ${hgAll && off.length ? `<div class="sub-h">いない人</div><div class="people">${off.map(personChip).join("")}</div>` : ""}`;
};

/* ---------- サーバー統計 ---------- */
function statsBody(){
  const pw = members.map(m=>m.power).filter(Boolean);
  const answered = members.filter(m=>m.sched).length;
  const kp = `<div class="kpis">
    <div><div class="k">登録人数</div><div class="v">${members.length}</div></div>

/* ---------- 自動チーム分け ---------- */
const teamOpt = { size: 4, charger: true, cats: true };
let teamRes = null;
function teamPower(list){ const p = list.map(m=>m.power).filter(Boolean); const a = p.length ? avg(p) : 0; return m => m.power || a; }
function teamScore(teams, pv){
  const avgs = teams.map(t=>avg(t.map(pv)));
  let sc = Math.max.apply(null, avgs) - Math.min.apply(null, avgs);
  teams.forEach(t=>{
    const c = {}; t.forEach(m=>{ if(m.mainCat) c[m.mainCat] = (c[m.mainCat]||0) + 1; });
    Object.keys(c).forEach(k=>{ const n = c[k]-1; if(n > 0){ if(k==="チャージャー" && teamOpt.charger) sc += 400*n; else if(teamOpt.cats) sc += 60*n; } });
  });
  return sc;
}
function makeTeams(list){
  const pv = teamPower(list), n = list.length;
  const T = Math.max(2, Math.round(n / teamOpt.size));
  const runs = n > 24 ? 24 : 50, cands = [];
  for(let run=0; run<runs; run++){
    const arr = list.map(m=>[m, pv(m) + (Math.random()-.5)*160]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const teams = []; for(let i=0; i<T; i++) teams.push([]);
    arr.forEach((m,i)=>{ const r = Math.floor(i/T), c = i%T; teams[r%2 ? T-1-c : c].push(m); });
    let sc = teamScore(teams, pv), improved = true, guard = 0;
    while(improved && guard++ < 30){
      improved = false;
      for(let a=0; a<T; a++) for(let b=a+1; b<T; b++) for(let i=0; i<teams[a].length; i++) for(let j=0; j<teams[b].length; j++){
        const x = teams[a][i], y = teams[b][j]; teams[a][i] = y; teams[b][j] = x;
        const s2 = teamScore(teams, pv);
        if(s2 < sc - 1e-9){ sc = s2; improved = true; } else { teams[a][i] = x; teams[b][j] = y; }
      }
    }
    cands.push({sc: sc, teams: teams});
  }
  cands.sort((a,b)=>a.sc-b.sc);
  const best = cands[0].sc, ok = cands.filter(c=>c.sc <= best + Math.max(15, best*0.15));
  const pick = ok[Math.floor(Math.random()*ok.length)];
  return { teams: pick.teams.map(t=>t.slice().sort((a,b)=>b.power-a.power)), pv: pv };
}

function teamBody(){
  const sel = selList();

  if(!teamRes || teamRes.n !== sel.length || teamRes.keys !== sel.map(m=>m.key).join("|")){ const r = makeTeams(sel); teamRes = {teams: r.teams, pv: r.pv, n: sel.length, keys: sel.map(m=>m.key).join("|")}; }
  const pv = teamRes.pv, teams = teamRes.teams;
  const avgs = teams.map(t=>avg(t.map(pv))), spread = Math.max.apply(null, avgs) - Math.min.apply(null, avgs);
  const sizes = teams.map(t=>t.length), uneven = Math.max.apply(null, sizes) !== Math.min.apply(null, sizes);
  const opts = `<div class="pf-sec"><div class="topts">

  const cards = teams.map((t,i)=>`<div class="team"><h4>チーム${TEAM_NAMES[i]}<span>平均 ${fmt(avgs[i])}・合計 ${fmt(t.map(pv).reduce((a,b)=>a+b,0))}</span></h4>${t.map(m=>`<div class="tm" data-key="${esc(m.key)}">${wIcon(m.main, m.mainCat, "sm")}<span class="tmn"><b>${esc(m.name)}</b><small>${esc(m.main) || "–"}</small></span><span class="p">${m.power || "–"}</span></div>`).join("")}</div>`).join("");

function cmpChart(a, b){

/* ---------- プロフィール画像（自己紹介などに） ---------- */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function svgImg(inner, color){
  return new Promise(res=>{
    const svg = `<svg xmlns="http:\/\/www.w3.org/2000/svg" viewBox="0 0 32 32">${inner.split("currentColor").join(color)}</svg>`;
    const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>res(null);

function loadImg(src){ return new Promise(res=>{ if(!src) return res(null); const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>res(null); im.src = src; }); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
const CARD_FF = '"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif';
function fitText(ctx, text, maxW, size, weight){
  let s = size; do { ctx.font = `${weight} ${s}px ${CARD_FF}`; s -= 2; } while(ctx.measureText(text).width > maxW && s > 14);
}
/* 一言を最大2行に折り返す（入りきらない分は「…」） */
function wrapLines(ctx, text, maxW, maxLines){
  const out = []; let line = "";
  for(const ch of text){
    if(ctx.measureText(line + ch).width > maxW){ out.push(line); line = ch; if(out.length === maxLines) break; }
    else line += ch;
  }
  if(out.length < maxLines && line) out.push(line);
  else if(out.length === maxLines){ let last = out[maxLines-1]; while(last && ctx.measureText(last + "…").width > maxW) last = last.slice(0, -1); out[maxLines-1] = last + "…"; }
  return out;
}
/* アイコン画像と一言は、この端末に人ごとに保存（次に作るときも残る） */

function drawCard(m){
  const color = cssVar("--c-" + (CAT_KEY[m.mainCat] || "none")) || "#5b3cf5";
  const cv = document.createElement("canvas"); cv.width = 1200; cv.height = 630;
  const ctx = cv.getContext("2d");
  const go = function(arr){
    const icon = arr[0], photo = arr[1];
    ctx.fillStyle = color; ctx.fillRect(0, 0, 1200, 630);
    const g = ctx.createLinearGradient(0, 0, 1200, 630); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.5)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1200, 630);
    ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.beginPath(); ctx.arc(1110, 60, 260, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.06)"; ctx.beginPath(); ctx.arc(960, 640, 200, 0, Math.PI*2); ctx.fill();
    /* アイコン：アップロードした画像があれば正方形に切り抜いて表示、なければブキ種アイコン */
    ctx.fillStyle = "#fff"; rr(ctx, 64, 64, 220, 220, 48); ctx.fill();

      const s = Math.min(photo.width, photo.height);
      ctx.save(); rr(ctx, 70, 70, 208, 208, 42); ctx.clip();
      ctx.drawImage(photo, (photo.width - s)/2, (photo.height - s)/2, s, s, 70, 70, 208, 208);
      ctx.restore();
    } else if(icon) ctx.drawImage(icon, 89, 89, 170, 170);

    const tags = [m.mainCat ? m.mainCat + "使い" : "", winsOf(m) ? "大会優勝 " + winsOf(m) + "回" : "", m.x ? "X @" + m.x : ""].filter(Boolean).join("　・　");
    fitText(ctx, tags, 820, 28, 600); ctx.globalAlpha = .9; ctx.fillText(tags, 322, 190); ctx.globalAlpha = 1;
    /* 一言 */
    const cm = cardState.comment.trim();
    if(cm){
      ctx.font = `700 30px ${CARD_FF}`;
      const lines = wrapLines(ctx, cm, 790, 2);
      ctx.fillStyle = "rgba(255,255,255,.16)"; rr(ctx, 318, 214, 818, lines.length > 1 ? 92 : 56, 16); ctx.fill();
      ctx.fillStyle = "#fff"; lines.forEach((l, i)=>ctx.fillText(l, 336, 252 + i*38));
    }
    const pct = percentile(m);
    const kp = [["最高パワー", String(m.power || "–")], ["パワー順位", m.rank + " / " + members.length], ["上位", pct != null ? pct + "%" : "–"]];
    kp.forEach((k, i)=>{
      const x = 64 + i*262, y = 330;
      ctx.fillStyle = "rgba(255,255,255,.16)"; rr(ctx, x, y, 246, 112, 22); ctx.fill();
      ctx.fillStyle = "#fff"; fitText(ctx, k[0], 210, 22, 600); ctx.globalAlpha = .85; ctx.fillText(k[0], x+22, y+38); ctx.globalAlpha = 1;
      fitText(ctx, k[1], 210, 44, 800); ctx.fillText(k[1], x+22, y+92);
    });
    const wl = "メイン  " + (m.main || "–") + ([m.sub1, m.sub2].filter(Boolean).length ? "　／　サブ  " + [m.sub1, m.sub2].filter(Boolean).join("・") : "");
    fitText(ctx, wl, 1070, 30, 700); ctx.fillText(wl, 66, 506);
    if(m.sched){ const s = schedSummary(m).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); if(s){ const t = "よく浮上する時間  " + s; fitText(ctx, t, 1070, 26, 600); ctx.globalAlpha = .9; ctx.fillText(t, 66, 552); ctx.globalAlpha = 1; } }
    const foot = "メンバー名簿 ・ " + fmtD(Date.now(), true);
    fitText(ctx, foot, 600, 20, 600); ctx.globalAlpha = .75; ctx.textAlign = "right"; ctx.fillText(foot, 1136, 602); ctx.textAlign = "left"; ctx.globalAlpha = 1;
    cv.toBlob(function(blob){
      if(!blob){ toast("画像を作れませんでした"); return; }
      if(cardState.url) URL.revokeObjectURL(cardState.url);
      cardState.url = URL.createObjectURL(blob);
      cardState.file = (typeof File === "function") ? new File([blob], m.name + "_プロフィール.png", {type: "image/png"}) : null;
      const img = $("tl").querySelector(".card-img"), dl = $("cardDl");
      if(img) img.src = cardState.url;
      if(dl) dl.href = cardState.url;
      const sh = $("cardShare");
      if(sh) sh.hidden = !(cardState.file && navigator.canShare && navigator.canShare({files: [cardState.file]}));
    }, "image/png");
  };
  const run = () => Promise.all([svgImg(ICONS[CAT_KEY[m.mainCat] || "none"], color), loadImg(cardState.img)]).then(go);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(run); else run();
}
function makeCard(m){
  const saved = cardLoad(m.key);
  cardState.key = m.key; cardState.img = saved.img; cardState.comment = saved.comment;
  openTool("プロフィール画像", "自己紹介やDiscordに貼るときに", ()=>`
    <img class="card-img" alt="${esc(m.name)}のプロフィール画像">
    <div class="pf-sec card-form">
      <div class="cf-row"><span>アイコン画像</span>
        <span class="cf-ctl"><label class="tbtn"><input type="file" accept="image/*" data-tlc="cimg" hidden>画像を選ぶ</label><button class="tbtn" data-tl="cimgdel"${cardState.img ? "" : " hidden"} id="cardImgDel">画像を外す</button></span></div>
      <div class="cf-note">正方形（1:1）で表示されます。縦長・横長の画像は中央が切り抜かれます。</div>
      <label class="cf-row"><span>一言</span><input type="text" id="cardComment" data-tli="ccomment" maxlength="50" placeholder="例：エリア好きです！気軽に誘ってください" value="${esc(cardState.comment)}"></label>
      <div class="cf-note">50文字まで（長いときは2行に折り返します）。画像と一言はこの端末に保存されます。</div>
    </div>
    <div class="tbtns"><a class="tbtn tform" id="cardDl" href="#" download="${esc(m.name)}_プロフィール.png">画像を保存</a><button class="tbtn" data-tl="cshare" id="cardShare" hidden>共有する</button></div>
    <div class="tsum">スマホでは画像を長押しして保存することもできます。</div>`);
  drawCard(m);
}
TL_ACTS.cshare = ()=>{ if(cardState.file) navigator.share({files: [cardState.file], title: "プロフィール"}).catch(function(){}); };
TL_ACTS.cimg = a=>{
  const f = a.files && a.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>loadImg(rd.result).then(im=>{
    if(!im){ toast("画像を読み込めませんでした"); return; }
    /* 中央を正方形に切り抜き、440px に縮めて保存（端末の保存容量を使いすぎないように） */
    const s = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = 440;
    c.getContext("2d").drawImage(im, (im.width - s)/2, (im.height - s)/2, s, s, 0, 0, 440, 440);
    cardState.img = c.toDataURL("image/jpeg", 0.9); cardSave();
    const del = $("cardImgDel"); if(del) del.hidden = false;
    const m = members.find(x=>x.key===cardState.key); if(m) drawCard(m);
  });
  rd.readAsDataURL(f);
};
TL_ACTS.cimgdel = ()=>{ cardState.img = ""; cardSave(); $("cardImgDel").hidden = true; const m = members.find(x=>x.key===cardState.key); if(m) drawCard(m); };
let cardT = null;
$("tlback").addEventListener("input", e=>{
  const a = e.target.closest("[data-tli=ccomment]"); if(!a) return;
  cardState.comment = a.value;
  clearTimeout(cardT); cardT = setTimeout(()=>{ cardSave(); const m = members.find(x=>x.key===cardState.key); if(m) drawCard(m); }, 300);
});

/* ---------- ボタンのつなぎ込み ---------- */
$("tools").addEventListener("click", e=>{
  const b = e.target.closest("[data-tool]"); if(!b) return;
  if(!members.length){ toast("読み込み中です"); return; }
  ({recent: openRecent, growth: openGrowth, stats: openStats, stale: openStale})[b.dataset.tool]();
});
$("selTeam").addEventListener("click", ()=>{ const n = selList().length; if(n < 4){ toast("チーム分けには4人以上選んでください（今は" + n + "人）"); return; } openTeam(); });
$("selTime").addEventListener("click", ()=>{ const n = selList().length; if(n < 2){ toast("2人以上選んでください"); return; } openOverlap(); });
$("selCmp").addEventListener("click", ()=>{ const l = selList(); if(l.length !== 2){ toast("比較する2人を選んでください（今は" + l.length + "人）"); return; } openCompare(l[0], l[1]); });
function onToolsData(){
  const rn = new Set(recentEvents(7).map(x=>x.m.key)).size;
  $("recentN").textContent = rn ? String(rn) : "";
  const sn = members.filter(isStale).length;
  $("staleN").textContent = sn ? String(sn) : "";
  if(tlOpen() && tlRender && !$("tl").querySelector(".card-img")) tlRender();
}
</script>
